<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raspberry Pi 5 — Уроки</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root { --bg: #181418; --panel: #221a20; --border: #342a32; --text: #ece6ea; --muted: #9a8d94; --raspberry: #b86b85; --cyan: #6eb8d4; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif; }
    .wrap { display: grid; grid-template-columns: 270px 1fr; min-height: 100vh; }
    @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } aside { border-right: none !important; border-bottom: 1px solid var(--border); } }
    aside { background: var(--panel); border-right: 1px solid var(--border); padding: 16px; overflow-y: auto; }
    main { padding: 24px 32px; overflow-y: auto; max-width: 840px; }
    .top-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .top-nav a { color: var(--muted); text-decoration: none; font-size: 0.85rem; padding: 5px 10px; border-radius: 6px; }
    .top-nav a:hover { color: var(--text); background: #352830; }
    .top-nav a.active { color: var(--raspberry); }
    h1.side { font-size: 1rem; margin: 0 0 12px; color: var(--raspberry); }
    .lesson-link { display: block; padding: 7px 10px; border-radius: 8px; color: var(--text); text-decoration: none; font-size: 0.82rem; margin-bottom: 3px; border: 1px solid transparent; }
    .lesson-link:hover { background: #352830; }
    .lesson-link.active { border-color: var(--raspberry); color: var(--raspberry); background: rgba(184,107,133,0.1); }
    #content { line-height: 1.65; font-size: 0.94rem; }
    #content h1 { font-size: 1.45rem; margin-top: 0; }
    #content h2 { font-size: 1.1rem; color: var(--cyan); margin-top: 1.4em; }
    #content code { background: #352830; padding: 2px 6px; border-radius: 4px; font-size: 0.88em; }
    #content pre { background: #1f161c; border: 1px solid var(--border); border-radius: 8px; padding: 14px; overflow-x: auto; }
    #content pre code { background: none; padding: 0; }
    #content table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 0.88rem; }
    #content th, #content td { border: 1px solid var(--border); padding: 8px; text-align: left; }
    #content th { background: #352830; }
    #loading { color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <aside>
      <nav class="top-nav">
        <a href="index.html">Тренажер</a>
        <a href="course.html" class="active">Уроки</a>
        <a href="cheatsheet.html">Шпаргалка</a>
      </nav>
      <h1 class="side">14 уроків Pi 5</h1>
      <a class="lesson-link active" href="#" data-file="raspberry-pi-terminal-course/README.md">Огляд</a>
      <a class="lesson-link" href="#" data-file="raspberry-pi-terminal-course/01-ssh-and-first-login.md">1. SSH</a>
      <a class="lesson-link" href="#" data-file="raspberry-pi-terminal-course/02-linux-terminal-basics.md">2. Terminal basics</a>
      <a class="lesson-link" href="#" data-file="raspberry-pi-terminal-course/03-files-and-folders.md">3. Файли</a>
      <a class="lesson-link" href="#" data-file="raspberry-pi-terminal-course/04-packages-and-updates.md">4. Пакети apt</a>
      <a class="lesson-link" href="#" data-file="raspberry-pi-terminal-course/05-network-diagnostics.md">5. Мережа</a>
      <a class="lesson-link" href="#" data-file="raspberry-pi-terminal-course/06-system-status-and-processes.md">6. Стан системи</a>
      <a class="lesson-link" href="#" data-file="raspberry-pi-terminal-course/07-python-on-raspberry-pi.md">7. Python</a>
      <a class="lesson-link" href="#" data-file="raspberry-pi-terminal-course/08-gpio-and-hardware.md">8. GPIO</a>
      <a class="lesson-link" href="#" data-file="raspberry-pi-terminal-course/09-systemd-services.md">9. systemd</a>
      <a class="lesson-link" href="#" data-file="raspberry-pi-terminal-course/10-logs-and-troubleshooting.md">10. Логи</a>
      <a class="lesson-link" href="#" data-file="raspberry-pi-terminal-course/11-git-and-project-workflow.md">11. Git</a>
      <a class="lesson-link" href="#" data-file="raspberry-pi-terminal-course/12-file-transfer-mac-to-pi.md">12. Mac→Pi</a>
      <a class="lesson-link" href="#" data-file="raspberry-pi-terminal-course/13-dangerous-commands.md">13. Небезпечні</a>
      <a class="lesson-link" href="#" data-file="raspberry-pi-terminal-course/14-daily-practice-plan.md">14. 14-денний план</a>
    </aside>
    <main>
      <div id="loading">Завантаження…</div>
      <article id="content"></article>
    </main>
  </div>
  <script>
    const links = document.querySelectorAll(".lesson-link");
    const content = document.getElementById("content");
    const loading = document.getElementById("loading");
    async function loadLesson(file) {
      loading.style.display = "block";
      content.innerHTML = "";
      try {
        const res = await fetch(file);
        if (!res.ok) throw new Error(res.statusText);
        content.innerHTML = marked.parse(await res.text());
        loading.style.display = "none";
        history.replaceState(null, "", `?lesson=${encodeURIComponent(file)}`);
      } catch (e) { loading.textContent = "Помилка: " + e.message; }
    }
    links.forEach(link => {
      link.addEventListener("click", e => {
        e.preventDefault();
        links.forEach(l => l.classList.remove("active"));
        link.classList.add("active");
        loadLesson(link.dataset.file);
      });
    });
    const initial = new URLSearchParams(location.search).get("lesson") || "raspberry-pi-terminal-course/README.md";
    const initLink = [...links].find(l => l.dataset.file === initial) || links[0];
    links.forEach(l => l.classList.toggle("active", l === initLink));
    loadLesson(initLink.dataset.file);
  </script>
</body>
</html>
